# Checks every push and pull request: typecheck, lint, unit tests, build, end-to-end
# tests, and the npm package contents (no example GPS data may ship in the tarball).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Every push and pull request runs on Linux. A manual run (workflow_dispatch) also runs on
    # macOS, which covers the sips preview test that Linux skips. GitHub's macOS queue can
    # stall, so macOS is never required for a push.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest","macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch Natural Earth geodata (the real-data geodata test reads this cache)
        shell: bash
        run: |
          dir="$HOME/.cache/tripmap/ne"
          mkdir -p "$dir"
          for name in ne_10m_land ne_10m_minor_islands ne_10m_admin_0_countries; do
            curl -fsSL -o "$dir/$name.geojson" \
              "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/$name.geojson"
          done
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (web)
        run: npm run lint -w @tripmap/web
      - name: Unit tests
        run: npm test
      - name: Build (both web modes are checked by pages.yml)
        run: npm run build
      - name: Install Chromium for end-to-end tests (Linux needs system libraries)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
        working-directory: packages/web
      - name: Install Chromium for end-to-end tests (macOS)
        if: runner.os == 'macOS'
        run: npx playwright install chromium
        working-directory: packages/web
      - name: End-to-end tests
        run: npm run test:e2e -w @tripmap/web
      - name: npm package must not contain example trip data
        run: |
          npm pack -w tripmap --dry-run 2>&1 | tee pack.log
          if grep -E 'examples/|\.yaml' pack.log; then
            echo "The npm package lists example trip data. Fix the package files list." >&2
            exit 1
          fi
      - name: Hosted build must not contain example trip data
        run: |
          VITE_MODE=hosted npm run build -w @tripmap/web
          if grep -rl 'examples/' packages/web/dist; then
            echo "The hosted build contains a reference to examples/." >&2
            exit 1
          fi
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: packages/web/playwright-report
          if-no-files-found: ignore
