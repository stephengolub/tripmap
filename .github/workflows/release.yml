# Publishes the tripmap npm package when a version tag (v1.2.3) is pushed.
#
# Auth is npm trusted publishing (OIDC): there is no NPM_TOKEN secret. The job STAGES the version
# with `npm stage publish`, which needs no 2FA prompt. A maintainer then approves the staged
# version with `npm stage approve` on their own machine, where 2FA is required. Staged packages
# are not public until approved. The trust relationship on npmjs.com must allow stage publish
# (see docs/releasing.md).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match packages/cli/package.json version $version." >&2
            exit 1
          fi
          echo "Releasing tripmap $version"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (web)
        run: npm run lint -w @tripmap/web
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium for end-to-end tests
        run: npx playwright install --with-deps chromium
        working-directory: packages/web
      - name: End-to-end tests
        run: npm run test:e2e -w @tripmap/web
      - name: The package must not contain example trip data
        run: |
          npm pack -w tripmap --dry-run 2>&1 | tee pack.log
          if grep -E 'examples/|\.yaml' pack.log; then
            echo "The npm package lists example trip data. Fix the package files list." >&2
            exit 1
          fi

  stage:
    name: Stage the release for approval
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # `npm stage` ships in npm 12, which needs Node 22.22.2+ or 24.15+. Node 24 here.
      - name: Upgrade npm to 12 (staged publishing)
        run: npm install -g npm@^12 && npm -v
      - run: npm ci
      - name: Build the package (prepack copies the web app)
        run: npm run build
      - name: Stage the version (skipped if this version is already published)
        # No NODE_AUTH_TOKEN: the OIDC exchange supplies the credential. Staging needs no 2FA; the
        # maintainer approves the staged version later. If the version is already published (the
        # manual first release, or a re-run after approval), skip so the GitHub release still runs.
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if npm view "tripmap@$version" version >/dev/null 2>&1; then
            echo "tripmap@$version is already published; nothing to stage."
            exit 0
          fi
          npm stage publish -w tripmap --access public --provenance
      - name: Show the staged versions
        run: npm stage list tripmap || true

  github-release:
    # Runs once the version is staged or already published. The GitHub release does not mean
    # the npm version is public yet: approval is a separate, manual step (docs/releasing.md).
    name: Create the GitHub release
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the release from the tag
        run: gh release create "$GITHUB_REF_NAME" --title "tripmap $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
