[project]
name = "tripmap"
version = "0.1.0"
description = "Turn a trip in your Photos library into a transparent route-map overlay"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pyyaml>=6",
    "shapely>=2",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
tripmap = "tripmap:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tripmap*"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs Chrome and the network caches; still runs by default as a regression check",
]
